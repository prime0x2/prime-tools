<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tile { position: relative; width: 100%; height: 100%; background: #db5c39; color: #fff; display: flex; align-items: center; gap: calc(var(--h) * .09); padding: 0 calc(var(--w) * .08); box-sizing: border-box; overflow: hidden; }
  .tile::after { content: ""; position: absolute; right: -12%; top: -30%; width: 70%; height: 160%; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.28)); transform: skewX(-14deg); }
  img { width: calc(var(--h) * .36); height: calc(var(--h) * .36); border-radius: 22%; box-shadow: 0 10px 30px rgba(0,0,0,.25); position: relative; z-index: 1; outline: 2px solid rgba(255,255,255,.35); }
  .text { position: relative; z-index: 1; }
  h1 { margin: 0; font-size: calc(var(--h) * .16); letter-spacing: -0.02em; line-height: 1; }
  p { margin: calc(var(--h) * .05) 0 0; font-size: calc(var(--h) * .068); opacity: .92; line-height: 1.3; max-width: 16em; }
</style>
</head>
<body>
  <div class="tile">
    <img id="icon" alt="">
    <div class="text">
      <h1>Prime Tools</h1>
      <p>Dim, blur or hide any part of a web page.</p>
    </div>
  </div>
</body>
</html>
