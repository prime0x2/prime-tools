<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 230px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #1e1e1e; color: #eee; }
    .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    #value { font-size: 20px; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; }
    button { width: 100%; margin-top: 8px; padding: 6px; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .seg { display: flex; gap: 6px; }
    .seg button.on { background: #4a4a4a; border-color: #888; }
    hr { border: 0; border-top: 1px solid #444; margin: 14px 0 10px; }
    .label { color: #aaa; font-size: 12px; }
    #msg { color: #aaa; margin: 10px 0 0; }
  </style>
</head>
<body>
  <div class="row"><span>Whole page</span><span id="value">10.0</span></div>
  <input id="level" type="range" min="0" max="10" step="0.1" value="10">
  <div class="seg">
    <button id="modeDim" class="on">Dim</button>
    <button id="modeBlur">Blur</button>
  </div>
  <button id="keep" hidden>Auto-apply on this site every visit</button>
  <hr>
  <div class="label">Areas (gone after reload)</div>
  <button id="hideArea">Hide an area</button>
  <button id="showArea">Show only an area</button>
  <button id="clearAreas">Clear areas</button>
  <p id="msg" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
